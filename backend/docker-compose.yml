services:
  postgres:
    image: postgres:16-alpine
    container_name: aesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     aisystem_user
      POSTGRES_PASSWORD: aisystem1234
      POSTGRES_DB:       aisystem_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aisystem_user -d aisystem_db']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: aesis_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: aesis
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aesis_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: aesis_ai
    restart: unless-stopped
    env_file: ../ai/.env
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_models:/tmp  # cache downloaded models + FAISS indices
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # allow time for model warm-up

  celery-worker:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: aesis_celery
    restart: unless-stopped
    env_file: ../ai/.env
    command: celery -A tasks.celery_app worker --loglevel=info -Q analysis,risk --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ai_models:/tmp

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  ai_models:

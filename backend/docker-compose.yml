services:
  postgres:
    image: postgres:16-alpine
    container_name: aesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     aisystem_user
      POSTGRES_PASSWORD: aisystem1234
      POSTGRES_DB:       aisystem_db
    ports:
      - '5433:5432'  # host 5433 → container 5432 (host 5432 is held by system postgres@18)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aisystem_user -d aisystem_db']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    # 4.4 is the last release that doesn't require AVX CPU instructions.
    # Mongo 5+ crashes on this host's Celeron N4000.
    image: mongo:4.4
    container_name: aesis_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: aesis
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # mongo 4.4 ships the legacy `mongo` shell, not `mongosh`.
      test: ['CMD', 'mongo', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aesis_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6380:6379'  # host 6380 → container 6379 (host 6379 is held by system redis-server)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: aesis_ai
    restart: unless-stopped
    env_file: ../ai/.env
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ai_models:/tmp  # cache downloaded models
    healthcheck:
      # python:3.11-slim has no curl — use urllib (always available).
      test: ['CMD', 'python', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health", timeout=3).status == 200 else 1)']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # allow time for model warm-up

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  ai_models:

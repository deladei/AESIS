services:
  # ── Backend API (Node.js) ──────────────────────────────────────────────────
  - type: web
    name: aesis-backend
    runtime: node
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Prod DB is a FREE Supabase Postgres (external), migrated off Neon in
      # Session 87: Neon free meters COMPUTE-HOURS per account and our 60s
      # enrichment poll kept its compute pinned on, so the monthly budget ran
      # out and `migrate deploy` could no longer connect — the boot loop that
      # took prod down. Supabase free does not meter compute (it only pauses a
      # project after ~7 days of zero activity). Before Neon it was a Render
      # free Postgres, which expired (S45) — do NOT relink to aesis-postgres-2
      # (dead).
      #
      # The value MUST be the SESSION-mode pooler string:
      #   postgresql://postgres.<ref>:<pw>@aws-N-<region>.pooler.supabase.com:5432/postgres
      # Not port 6543 (transaction mode can't run `prisma migrate deploy`) and
      # not db.<ref>.supabase.co (IPv6-only, unreachable from Render).
      # External resource → set in the dashboard, sync:false.
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      # Live Redis is an EXTERNAL Upstash instance (set in the dashboard, S47),
      # NOT a Render-managed keyvalue. Keep sync:false so a blueprint sync never
      # overrides the live Upstash URL with an empty Render instance. See #4.
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY_DAYS
        value: 7
      - key: BCRYPT_ROUNDS
        value: 12
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AI_ENGINE_URL
        sync: false
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@aesis.cs.edu
      - key: EMAIL_FROM_NAME
        value: AESIS System
      # Cloudinary is the LIVE object store for logbook/entry attachments
      # (config/cloudinary.ts + modules/entries/attachments.service.ts). All
      # three are optional so dev/test boot without them; when unset the upload
      # route returns 503 (isCloudinaryConfigured) rather than silently dropping
      # files. Set the real values in the dashboard (sync:false).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # LEGACY / UNUSED — the AWS_* vars below predate the Cloudinary switch and
      # are referenced nowhere but env.ts (no aws-sdk in the tree). Kept declared
      # (optional) so a blueprint sync doesn't churn the dashboard; safe to drop
      # once confirmed no external tooling reads them.
      - key: AWS_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-west-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Google sign-in. All three optional — unset, the button is not rendered
      # and the routes report "not configured", so the app behaves exactly as
      # it did before. GOOGLE_REDIRECT_URI must match a redirect URI on the
      # OAuth client BYTE FOR BYTE (Google compares the whole string, so a
      # trailing slash or http-vs-https is a rejected login):
      #   https://aesis.onrender.com/api/v1/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Magic-link industry-score token lifetime (hours). Defaults to 336 (14d)
      # in env.ts; declared here so the prod TTL is visible in the blueprint.
      - key: INDUSTRY_SCORE_TOKEN_TTL_HOURS
        value: "336"
      - key: SENTRY_DSN
        sync: false
      # Weekly logbook grades are binding: a 0–100 score is required to
      # acknowledge each submitted week (confirmed regulation, 2026-06-09).
      - key: WEEKLY_BINDING_GRADES
        value: "true"

  # ── AI Engine (FastAPI via Docker) ─────────────────────────────────────────
  - type: web
    name: aesis-ai-engine
    runtime: docker
    rootDir: ai
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Reported back in /health; defaults to "development" in settings.py if
      # unset (the cosmetic env:development the engine showed since S47).
      - key: ENVIRONMENT
        value: production
      # The FastAPI code reads POSTGRES_DSN (ai/config/database.py), NOT
      # DATABASE_URL. It must be the SAME database as the backend's
      # DATABASE_URL: the assistant's corpus lives in `knowledge_passage`, and
      # that table is created by the backend's `prisma migrate deploy`.
      #
      # This is now COPIED from the backend rather than set independently,
      # because two dashboard variables that must match and are edited
      # separately will eventually stop matching. They did: S46 pointed this at
      # Neon, S88 moved prod to Supabase and repointed only the backend, and
      # from then until S101 the engine read a database with no corpus table in
      # it. Nothing surfaced — /health stayed 200 and the assistant just said it
      # could not help.
      #
      # If a blueprint sync cannot resolve `fromService` against a `sync:false`
      # variable on the other service, fall back to `sync: false` here and set
      # it by hand — but then re-read the paragraph above, because that is the
      # exact arrangement that broke.
      - key: POSTGRES_DSN
        fromService:
          type: web
          name: aesis-backend
          envVarKey: DATABASE_URL
      - key: MONGO_URI
        sync: false
      # FastAPI validates the inbound x-api-key against env AI_API_KEY
      # (ai/config/settings.py + routers/*._require_internal), NOT
      # AI_ENGINE_API_KEY. Its VALUE must equal the backend's
      # AI_ENGINE_API_KEY (what the backend sends as x-api-key).
      - key: AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # llama-3.1-8b-instant was decommissioned by Groq. Every completion
      # returned 404 and every caller here fails open, so chat, competency
      # classification, summaries, quality assessment and the feedback drafts
      # all quietly ran on their heuristic fallbacks instead — and /health said
      # "connected" throughout, because it only checked that Groq answered, not
      # that the model existed. It checks both now.
      #
      # A model id is not forever. When this one goes the same way, GET
      # /health reports `modelStatus` and lists the ids Groq currently serves.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

# ── Celery worker — RETIRED (S82, 2026-07-09) ────────────────────────────────
# The legacy analyze_logbook pipeline was UI-unreachable dead code; the v2
# synchronous /ai/enrich/entry pipeline replaced it. The `aesis-celery-worker`
# service was removed from this blueprint — ALSO delete the service in the
# Render dashboard (it bills starter-plan money) and drop the now-unused
# CELERY_BROKER_URL + REDIS_URL env vars from aesis-ai-engine there.

# ── Redis (EXTERNAL — Upstash) ───────────────────────────────────────────────
# Still used by the BACKEND (rate limiter); the AI side no longer touches Redis
# since the Celery retirement. Set per-service in the dashboard (REDIS_URL,
# sync:false) — the SAME pattern as Neon Postgres below. There is intentionally
# NO Render `keyvalue` block: an earlier render.yaml declared a managed
# `aesis-redis` and wired every service to it via `fromService`, which on a
# blueprint sync would override the live Upstash URL with an empty Render
# instance. See HANDOFF S47/S82.
#
# NOTE: the prod Postgres is a free SUPABASE instance (external), cut over in
# S88 after Neon ran out of compute-hours — see the DATABASE_URL comment on the
# backend for the exact connection-string requirements. It is NOT a
# Render-managed resource, so there is no `databases:` block, and the old
# Render-managed aesis-postgres-2 expired long ago; do not re-add it.
#
# The AI engine's POSTGRES_DSN is copied from the backend above rather than set
# on its own. This block used to say "point POSTGRES_DSN at the Neon string",
# and it went on saying it for three months after prod left Neon — which is how
# the engine ended up reading a dead database. One source, not two.

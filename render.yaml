services:
  # ── Backend API (Node.js) ──────────────────────────────────────────────────
  - type: web
    name: aesis-backend
    runtime: node
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: aesis-postgres
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY_DAYS
        value: 7
      - key: BCRYPT_ROUNDS
        value: 12
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AI_ENGINE_URL
        sync: false
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@aesis.cs.edu
      - key: EMAIL_FROM_NAME
        value: AESIS System
      - key: AWS_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-west-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── AI Engine (FastAPI via Docker) ─────────────────────────────────────────
  - type: web
    name: aesis-ai-engine
    runtime: docker
    rootDir: ai
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aesis-postgres
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

  # ── Celery Worker (background, same Docker image) ──────────────────────────
  - type: worker
    name: aesis-celery-worker
    runtime: docker
    rootDir: ai
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    dockerCommand: celery -A tasks.celery_app worker --loglevel=info -Q analysis,risk --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aesis-postgres
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString

  # ── Redis / Key Value (Render managed) ─────────────────────────────────────
  # Declared as a first-class managed dependency so REDIS_URL is auto-wired to a
  # real, reachable, same-region instance — instead of a dangling external URL
  # (`sync: false`) that, when unreachable, hung the AI rate limiter. Backs the
  # AI rate limiter, caches, and the Celery broker.
  # ipAllowList: [] = private network only (no public access).
  - type: keyvalue
    name: aesis-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction   # don't evict Celery broker messages / rate-limit keys
    ipAllowList: []

databases:
  # ── PostgreSQL 16 (Render managed) ────────────────────────────────────────
  - name: aesis-postgres
    databaseName: aesis_db
    user: aesis_user
    region: oregon
    plan: free

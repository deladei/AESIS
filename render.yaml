services:
  # ── Backend API (Node.js) ──────────────────────────────────────────────────
  - type: web
    name: aesis-backend
    runtime: node
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Prod DB migrated to a FREE Neon Postgres (external, non-expiring) in
      # Session 45 after the Render free Postgres expired. Neon is NOT a
      # Render-managed resource, so DATABASE_URL is set in the dashboard
      # (sync:false). Do NOT relink this to aesis-postgres-2 (dead) or prod
      # login breaks again. See HANDOFF S45.
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY_DAYS
        value: 7
      - key: BCRYPT_ROUNDS
        value: 12
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AI_ENGINE_URL
        sync: false
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@aesis.cs.edu
      - key: EMAIL_FROM_NAME
        value: AESIS System
      - key: AWS_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-west-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Weekly logbook grades are binding: a 0–100 score is required to
      # acknowledge each submitted week (confirmed regulation, 2026-06-09).
      - key: WEEKLY_BINDING_GRADES
        value: "true"

  # ── AI Engine (FastAPI via Docker) ─────────────────────────────────────────
  - type: web
    name: aesis-ai-engine
    runtime: docker
    rootDir: ai
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # NOTE: the FastAPI code reads POSTGRES_DSN (ai/config/database.py),
      # NOT DATABASE_URL. Point this at the Neon string (same value as the
      # backend's DATABASE_URL) in the dashboard. See HANDOFF S45.
      - key: POSTGRES_DSN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

  # ── Celery Worker (background, same Docker image) ──────────────────────────
  - type: worker
    name: aesis-celery-worker
    runtime: docker
    rootDir: ai
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    dockerCommand: celery -A tasks.celery_app worker --loglevel=info -Q analysis,risk --concurrency=2
    envVars:
      # Worker shares the AI image — reads POSTGRES_DSN, not DATABASE_URL.
      # Set to the Neon string in the dashboard. See HANDOFF S45.
      - key: POSTGRES_DSN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: aesis-redis
          type: keyvalue
          property: connectionString

  # ── Redis / Key Value (Render managed) ─────────────────────────────────────
  # Declared as a first-class managed dependency so REDIS_URL is auto-wired to a
  # real, reachable, same-region instance — instead of a dangling external URL
  # (`sync: false`) that, when unreachable, hung the AI rate limiter. Backs the
  # AI rate limiter, caches, and the Celery broker.
  # ipAllowList: [] = private network only (no public access).
  - type: keyvalue
    name: aesis-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction   # don't evict Celery broker messages / rate-limit keys
    ipAllowList: []

# NOTE (Session 45): the prod Postgres is now a FREE Neon instance (external,
# non-expiring) — host ep-autumn-waterfall-a6nt7o2h.us-west-2.aws.neon.tech.
# It is NOT a Render-managed resource, so there is no `databases:` block. Each
# service's DATABASE_URL / POSTGRES_DSN is set in the dashboard (sync:false).
# The old Render-managed aesis-postgres-2 expired and is gone; do not re-add it.

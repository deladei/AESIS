services:
  # ── Backend API (Node.js) ──────────────────────────────────────────────────
  - type: web
    name: aesis-backend
    runtime: node
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Prod DB migrated to a FREE Neon Postgres (external, non-expiring) in
      # Session 45 after the Render free Postgres expired. Neon is NOT a
      # Render-managed resource, so DATABASE_URL is set in the dashboard
      # (sync:false). Do NOT relink this to aesis-postgres-2 (dead) or prod
      # login breaks again. See HANDOFF S45.
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      # Live Redis is an EXTERNAL Upstash instance (set in the dashboard, S47),
      # NOT a Render-managed keyvalue. Keep sync:false so a blueprint sync never
      # overrides the live Upstash URL with an empty Render instance. See #4.
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY_DAYS
        value: 7
      - key: BCRYPT_ROUNDS
        value: 12
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AI_ENGINE_URL
        sync: false
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@aesis.cs.edu
      - key: EMAIL_FROM_NAME
        value: AESIS System
      # Cloudinary is the LIVE object store for logbook/entry attachments
      # (config/cloudinary.ts + modules/entries/attachments.service.ts). All
      # three are optional so dev/test boot without them; when unset the upload
      # route returns 503 (isCloudinaryConfigured) rather than silently dropping
      # files. Set the real values in the dashboard (sync:false).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # LEGACY / UNUSED — the AWS_* vars below predate the Cloudinary switch and
      # are referenced nowhere but env.ts (no aws-sdk in the tree). Kept declared
      # (optional) so a blueprint sync doesn't churn the dashboard; safe to drop
      # once confirmed no external tooling reads them.
      - key: AWS_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-west-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Magic-link industry-score token lifetime (hours). Defaults to 336 (14d)
      # in env.ts; declared here so the prod TTL is visible in the blueprint.
      - key: INDUSTRY_SCORE_TOKEN_TTL_HOURS
        value: "336"
      - key: SENTRY_DSN
        sync: false
      # Weekly logbook grades are binding: a 0–100 score is required to
      # acknowledge each submitted week (confirmed regulation, 2026-06-09).
      - key: WEEKLY_BINDING_GRADES
        value: "true"

  # ── AI Engine (FastAPI via Docker) ─────────────────────────────────────────
  - type: web
    name: aesis-ai-engine
    runtime: docker
    rootDir: ai
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Reported back in /health; defaults to "development" in settings.py if
      # unset (the cosmetic env:development the engine showed since S47).
      - key: ENVIRONMENT
        value: production
      # NOTE: the FastAPI code reads POSTGRES_DSN (ai/config/database.py),
      # NOT DATABASE_URL. Point this at the Neon string (same value as the
      # backend's DATABASE_URL) in the dashboard. See HANDOFF S45.
      - key: POSTGRES_DSN
        sync: false
      - key: MONGO_URI
        sync: false
      # External Upstash (dashboard, S47) — keep sync:false (see #4 / backend note).
      - key: REDIS_URL
        sync: false
      # FastAPI validates the inbound x-api-key against env AI_API_KEY
      # (ai/config/settings.py + routers/*._require_internal), NOT
      # AI_ENGINE_API_KEY. Its VALUE must equal the backend's
      # AI_ENGINE_API_KEY (what the backend sends as x-api-key).
      - key: AI_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

  # ── Celery Worker (background, same Docker image) ──────────────────────────
  - type: worker
    name: aesis-celery-worker
    runtime: docker
    rootDir: ai
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    dockerCommand: celery -A tasks.celery_app worker --loglevel=info -Q analysis,risk --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      # Worker shares the AI image — reads POSTGRES_DSN, not DATABASE_URL.
      # Set to the Neon string in the dashboard. See HANDOFF S45.
      - key: POSTGRES_DSN
        sync: false
      - key: MONGO_URI
        sync: false
      # External Upstash (dashboard, S47) — keep sync:false (see #4 / backend note).
      - key: REDIS_URL
        sync: false
      # Worker shares the AI image; same key var as the engine: AI_API_KEY
      # (value = backend's AI_ENGINE_API_KEY). Not AI_ENGINE_API_KEY.
      - key: AI_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        sync: false

# ── Redis (EXTERNAL — Upstash) ───────────────────────────────────────────────
# NOTE (Session 57 reconcile, #4): live Redis is an EXTERNAL Upstash instance,
# set per-service in the dashboard (REDIS_URL / CELERY_BROKER_URL, sync:false) —
# the SAME pattern as Neon Postgres below. There is intentionally NO Render
# `keyvalue` block: an earlier render.yaml declared a managed `aesis-redis` and
# wired every service to it via `fromService`, which on a blueprint sync would
# override the live Upstash URLs with an empty Render instance (broker data lost,
# AI rate limiter hung). Do not re-add a managed redis unless you also migrate
# the broker off Upstash. See HANDOFF S47.
#
# NOTE (Session 45): the prod Postgres is now a FREE Neon instance (external,
# non-expiring) — host ep-autumn-waterfall-a6nt7o2h.us-west-2.aws.neon.tech.
# It is NOT a Render-managed resource, so there is no `databases:` block. Each
# service's DATABASE_URL / POSTGRES_DSN is set in the dashboard (sync:false).
# The old Render-managed aesis-postgres-2 expired and is gone; do not re-add it.
